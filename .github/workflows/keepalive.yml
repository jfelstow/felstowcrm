name: Supabase keep-alive

# WHY THIS EXISTS:
# Supabase free-tier projects are PAUSED after 7 days with no activity, which
# takes the CRM's database offline. This workflow pings the Supabase REST API
# once a day so the project never sits idle long enough to be paused.
#
# It reads the URL + anon key straight out of config.js, so there is a single
# source of truth — if the project is ever recreated with a new ref, just
# update config.js and this keeps working.
#
# The daily heartbeat commit also keeps THIS repo active, which stops GitHub
# from auto-disabling scheduled workflows after 60 days of repo inactivity.

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC daily (~7-8am Central). Off-the-hour avoids GitHub's busy top-of-hour queue.
  workflow_dispatch: {}       # also runnable on-demand from the Actions tab

permissions:
  contents: write             # needed to push the heartbeat commit

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read Supabase URL + anon key from config.js
        id: cfg
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js | head -1)
          KEY=$(grep 'SUPABASE_ANON_KEY' config.js | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Could not parse SUPABASE_URL / SUPABASE_ANON_KEY out of config.js"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Ping Supabase keepalive RPC (a REAL DB write = real activity)
        run: |
          # We call the public.keepalive() RPC, NOT a table read. A plain anon
          # read of /rest/v1/clients returns HTTP 401 (anon has no table grant)
          # and is rejected BEFORE touching the database, so it does NOT reset
          # Supabase's inactivity timer — that is exactly why the project paused
          # on 2026-06-23 despite green runs. The RPC performs a genuine write.
          #
          # `|| true` so a DNS/connection failure (curl exit != 0) doesn't abort
          # the step before our friendly messages below — curl still emits the
          # http_code (000) via -w.
          resp=$(curl -s -w $'\n%{http_code}' --max-time 30 \
            -X POST \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ steps.cfg.outputs.url }}/rest/v1/rpc/keepalive" || true)
          code=$(printf '%s' "$resp" | tail -1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "Supabase responded HTTP $code"
          echo "Body: $body"
          # "000" = no connection at all -> project is paused or deleted.
          if [ "$code" = "000" ]; then
            echo "::error::Supabase did not respond (HTTP 000). The project is likely paused or deleted — restore it at https://supabase.com/dashboard/project/hqrjgstphobxfsvlvmik"
            exit 1
          fi
          # Anything other than 200 means the write did NOT happen (e.g. 404 =
          # migration-keepalive.sql not applied; 401/403 = anon missing EXECUTE).
          # A non-200 ping does NOT reset the timer, so fail loudly rather than
          # silently logging a useless "success" like the old version did.
          if [ "$code" != "200" ]; then
            echo "::error::keepalive RPC returned HTTP $code (expected 200). The ping did NOT write to the DB, so the inactivity timer was NOT reset. Ensure migration-keepalive.sql has been run and anon has EXECUTE on public.keepalive()."
            exit 1
          fi

      - name: Heartbeat (keeps this repo active so the schedule isn't auto-disabled)
        run: |
          date -u "+CRM keep-alive last ran: %Y-%m-%d %H:%M UTC" > keepalive.txt
          git config user.name  "felstow-crm-keepalive"
          git config user.email "actions@github.com"
          git add keepalive.txt
          git commit -m "chore: keep-alive heartbeat [skip ci]" || exit 0
          git push
